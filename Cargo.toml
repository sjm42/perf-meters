# Cargo.toml

[package]
name = "perf_meters"
version = "1.4.0"
edition = "2024"
resolver = "2"


[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
serialport = "4.10"
sysinfo = "0.40"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"


[build-dependencies]
anyhow = "1.0"
build-data = "0.3"


[profile.release]
codegen-units = 1
lto = "fat"
debug = 0
opt-level = 3

# EOF
